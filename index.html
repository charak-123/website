<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // After a deploy, a page cached from before it asks for script files
      // that no longer exist. Reload once to pick up the current page, and
      // no more than once a minute, so a real outage cannot loop.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || !/\/assets\//.test(t.src || '')) return;
        try {
          var last = Number(sessionStorage.getItem('charak-asset-reload') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('charak-asset-reload', String(Date.now()));
        } catch (_) {}
        location.reload();
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F3EC" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="CHARAK connects patients with verified doctors for online consultations and home visits." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,300..700,0..100,0..1&family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Devanagari:wdth,wght@75..125,300..800&display=swap" rel="stylesheet" />
    <title>CHARAK | Virtual Healthcare & Consultations</title>

    <!-- og:image must be an absolute URL for WhatsApp/Facebook scrapers. -->
    <meta property="og:url" content="https://www.charak.care/" />

    <meta property="og:site_name" content="Charak" />
    <meta property="og:title" content="CHARAK | Verified doctors, online or at home" />
    <meta
      property="og:description"
      content="Charak connects patients with verified doctors for online consultations and home visits."
    />
    <meta property="og:image" content="https://www.charak.care/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CHARAK | Verified doctors, online or at home" />
    <meta name="twitter:image" content="https://www.charak.care/og-image.jpg" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
